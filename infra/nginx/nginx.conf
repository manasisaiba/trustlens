limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=start:10m rate=6r/m;

# HTTP: allow certificate renewal, redirect everything else
server {
    listen 80;
    server_name trustlens360.com www.trustlens360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name trustlens360.com www.trustlens360.com;

    ssl_certificate /etc/letsencrypt/live/trustlens360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustlens360.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/(audits/[^/]+/(generate-personas|start-testing|generate-preview)|businesses)$ {
        limit_req zone=start burst=10 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/proxy_common.conf;
    }
}
